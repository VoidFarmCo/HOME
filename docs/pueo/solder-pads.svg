<svg viewBox="0 0 900 672" role="img" aria-labelledby="sold-t sold-d" font-family="JetBrains Mono, Consolas, monospace">
<title id="sold-t">Where the six soldered joints land on the ESP32 module</title>
<desc id="sold-d">The ESP32-WROOM-32 module with its antenna at the top, which is how the build guide counts pads. Nineteen castellated pads run down each long edge, numbered 1 at the top to 19 at the bottom on both sides, so pad 1 is the end nearest the antenna. Five of the six soldered signals are on the right-hand edge: pad 2 is IO23 carrying VSPI MOSI, pad 8 is IO19 carrying VSPI MISO, pad 9 is IO18 carrying VSPI SCK, pad 11 is IO17 carrying the PN532 slave select, and pad 12 is IO16 carrying the NRF24 chip enable. Those five are drawn in orange, which means solder here. The sixth is pad 10 on the left-hand edge, IO25, carrying the NRF24 chip select. Five pads on the right edge are marked with a double exclamation mark as hazards. Pad 10 is IO5, the microSD card's chip select, and it sits directly between IO18 and IO17, which are two of the targets. Pad 14 is IO0, the boot strapping pin. Pads 17, 18 and 19 are SD1, SD0 and CLK, the module's internal flash, and bridging any of them stops the board booting. The left edge is drawn numbered but unnamed apart from pad 10, because that is all the build guide records for that side.</desc>
<rect x="0" y="0" width="900" height="672" fill="var(--bg-card, #0a1116)"/>
<text x="20" y="24" fill="var(--text-dim, #9fb3bf)" font-size="13">Where the six soldered joints are</text>
<text x="20" y="44" fill="var(--text-dim, #9fb3bf)" font-size="10.5">Turn the board until the antenna points up and this is what you see. Pad 1 is the antenna end, both sides.</text>
<rect x="596" y="96" width="14" height="10" rx="2" fill="var(--bg-card, #0a1116)" stroke="var(--orange, #ffa62b)" stroke-width="1.5"/>
<text x="618" y="105" fill="var(--orange, #ffa62b)" font-size="10.5">solder here, six of them</text>
<text x="596" y="129" fill="var(--text, #d7e0e6)" font-size="10.5" font-weight="bold">!!</text>
<text x="618" y="129" fill="var(--text, #d7e0e6)" font-size="10.5">ruins the board</text>
